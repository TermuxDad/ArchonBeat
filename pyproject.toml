[project]
name = "ArchonBeat"
version = "1.0.0"
description = "High-Performance Advanced Music Bot for Telegram"
readme = ".github/README.md"
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "dnspython>=2.4.0",
    "ffmpeg-python>=0.2.0",
    "gitpython>=3.1.40",
    "hachoir>=3.2.0",
    "heroku3>=5.2.0",
    "httpx>=0.27.0",
    "kurigram>=2.1.0",
    "motor>=3.3.0",
    "numpy>=1.26.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "psutil>=5.9.0",
    "py-tgcalls>=2.1.0",
    "pymongo>=4.6.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "speedtest-cli>=2.1.3",
    "spotipy>=2.23.0",
    "tgcrypto>=1.2.5; sys_platform != 'win32'",
    "unidecode>=1.3.0",
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "yt-dlp>=2024.3.10",
    "yt-search-py>=1.0.0",
]

[dependency-groups]
dev = []

[tool.uv]
dev-dependencies = []
